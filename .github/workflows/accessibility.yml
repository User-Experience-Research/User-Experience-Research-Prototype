name: Accessibility

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pa11y:
    name: WCAG 2 AA
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Start the static prototype
        run: |
          python3 -m http.server 4173 > /tmp/nmsi-prototype-server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/nmsi-prototype-server.log
          exit 1

      - name: Run automated accessibility checks
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          cat > /tmp/pa11yci.cjs <<'PA11Y_CONFIG'
          const chromePath = process.env.CHROME_PATH || "/usr/bin/google-chrome";

          module.exports = {
            defaults: {
              standard: "WCAG2AA",
              timeout: 30000,
              wait: 300,
              chromeLaunchConfig: {
                executablePath: chromePath,
                args: ["--no-sandbox", "--disable-dev-shm-usage"]
              }
            },
            urls: [
              "http://127.0.0.1:4173/",
              {
                url: "http://127.0.0.1:4173/",
                actions: [
                  "click element #login-screen .login-card button[type='submit']",
                  "wait for element #screen-dashboard.is-active to be visible",
                  "click element [data-nav='support']",
                  "wait for element #screen-support.is-active to be visible"
                ]
              },
              {
                url: "http://127.0.0.1:4173/",
                actions: [
                  "click element #login-screen .login-card button[type='submit']",
                  "wait for element #screen-dashboard.is-active to be visible",
                  "click element [data-nav='support']",
                  "wait for element #screen-support.is-active to be visible",
                  "click element button[aria-label='View Academic Skills & Extensions details']",
                  "wait for element #screen-detail.is-active to be visible"
                ]
              },
              {
                url: "http://127.0.0.1:4173/",
                actions: [
                  "click element #login-screen .login-card button[type='submit']",
                  "wait for element #screen-dashboard.is-active to be visible",
                  "click element [data-nav='support']",
                  "wait for element #screen-support.is-active to be visible",
                  "click element button[aria-label='View Academic Skills & Extensions details']",
                  "wait for element #screen-detail.is-active to be visible",
                  "click element #screen-detail .detail-side .button",
                  "wait for element #screen-booking.is-active to be visible",
                  "click element #screen-booking .booking-form button[type='submit']",
                  "wait for element #screen-confirmation.is-active to be visible"
                ]
              }
            ]
          };
          PA11Y_CONFIG
          npx --yes pa11y-ci@4 --config /tmp/pa11yci.cjs --threshold 0
