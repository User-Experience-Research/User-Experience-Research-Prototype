services:
  - type: web
    name: nmsi-support-navigator
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/User-Experience-Research/User-Experience-Research-Prototype.git
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: nmsi-support-database
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: DEEPSEEK_MODEL
        value: deepseek-v4-flash
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com/v1

databases:
  - name: nmsi-support-database
    plan: free
    region: singapore
    databaseName: nmsi_support
    user: nmsi_support
    postgresMajorVersion: "18"
    ipAllowList: []
