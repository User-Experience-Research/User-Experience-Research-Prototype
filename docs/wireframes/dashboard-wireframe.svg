<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680" viewBox="0 0 1000 680" role="img" aria-labelledby="title desc">
  <title id="title">Dashboard wireframe</title>
  <desc id="desc">Black and white dashboard line drawing with persistent sidebar, highlighted Support Navigator and chat launcher.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#000"/></marker>
    <style>.box{fill:#fff;stroke:#000;stroke-width:3}.thin{fill:none;stroke:#000;stroke-width:2}.dash{fill:#fff;stroke:#000;stroke-width:2;stroke-dasharray:8 6}.t{font-family:Arial,sans-serif;fill:#000;font-size:20px}.s{font-family:Arial,sans-serif;fill:#000;font-size:16px}.h{font-family:Arial,sans-serif;fill:#000;font-size:30px;font-weight:700}.line{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1000" height="680" fill="#fff"/>
  <text x="40" y="45" class="h">D1 — Student services dashboard</text>
  <rect x="45" y="80" width="700" height="540" class="box"/>
  <rect x="45" y="80" width="175" height="540" class="box"/>
  <text x="80" y="125" class="h">NMSI</text>
  <text x="70" y="175" class="s">Demo Student</text>
  <rect x="60" y="205" width="145" height="38" class="box"/><text x="82" y="230" class="s">Home</text>
  <rect x="60" y="252" width="145" height="52" class="box"/><text x="73" y="284" class="s">Support Navigator</text>
  <rect x="60" y="313" width="145" height="42" class="box"/><text x="73" y="340" class="s">My appointments</text>
  <text x="73" y="397" class="s">Learning</text><text x="73" y="440" class="s">Timetable</text>
  <text x="73" y="580" class="s">Sign out</text>
  <rect x="220" y="80" width="525" height="55" class="box"/>
  <text x="240" y="115" class="s">North-western Medical and Science Institute</text>
  <rect x="610" y="88" width="120" height="37" class="box"/><text x="626" y="112" class="s">Large font</text>
  <text x="255" y="180" class="s">HOME</text><text x="255" y="220" class="h">Student services</text>
  <rect x="255" y="255" width="450" height="210" class="box"/>
  <text x="280" y="288" class="s">STUDENT SUPPORT</text>
  <text x="280" y="325" class="t">Start with your situation,</text>
  <text x="280" y="352" class="t">not the university structure</text>
  <text x="280" y="390" class="s">Search • Compare • Book</text>
  <rect x="500" y="403" width="170" height="42" class="box"/>
  <text x="518" y="430" class="s">Open Navigator</text>
  <rect x="255" y="490" width="135" height="70" class="box"/><text x="275" y="530" class="s">Learning</text>
  <rect x="408" y="490" width="135" height="70" class="box"/><text x="430" y="530" class="s">Timetable</text>
  <rect x="560" y="490" width="145" height="70" class="box"/><text x="577" y="520" class="s">My</text><text x="577" y="543" class="s">appointments</text>
  <circle cx="705" cy="585" r="25" class="box"/><text x="697" y="592" class="t">?</text>
  <rect x="785" y="155" width="185" height="125" class="dash"/>
  <text x="803" y="185" class="s">Primary route is visually</text><text x="803" y="210" class="s">prominent because students</text><text x="803" y="235" class="s">start from the problem.</text>
  <path d="M785 230 C755 250 730 310 670 325" class="line"/>
  <rect x="785" y="440" width="185" height="110" class="dash"/>
  <text x="803" y="470" class="s">Chat remains available</text><text x="803" y="495" class="s">before a category is known.</text>
  <path d="M785 505 C760 540 748 570 730 585" class="line"/>
  <text x="55" y="655" class="s">Evidence: own-language entry T01–T03; immediate guidance responds to teacher feedback.</text>
</svg>
