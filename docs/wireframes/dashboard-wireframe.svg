  <text x="58" y="320" class="s">▣  My appointments</text>
  <text x="58" y="365" class="s">▤  Learning</text><text x="58" y="410" class="s">◷  My timetable</text>
  <rect x="55" y="565" width="130" height="40" class="box"/><text x="73" y="590" class="s">↪  Sign out</text>

  <rect x="205" y="75" width="620" height="50" class="box"/>
  <text x="230" y="106" class="s">Institute name</text><rect x="690" y="82" width="115" height="35" class="box"/><text x="706" y="105" class="s">Large font</text>
  <rect x="205" y="125" width="620" height="95" class="box"/>
  <circle cx="515" cy="172" r="35" class="box"/><text x="490" y="178" class="s">N M S I</text>

  <text x="235" y="255" class="s">HOME</text><text x="235" y="290" class="h">Student services</text>
  <text x="235" y="317" class="s">Open a student service or continue with a support request.</text>
  <text x="235" y="355" class="t">Support and student systems</text>
  <rect x="235" y="375" width="550" height="205" class="box"/>
  <rect x="235" y="375" width="260" height="205" class="box"/>
  <rect x="260" y="420" width="60" height="60" class="box"/><text x="281" y="458" class="h">＋</text>
  <text x="340" y="420" class="s">RECOMMENDED ROUTE</text>
  <text x="340" y="453" class="t">Start with what</text><text x="340" y="478" class="t">is happening</text>
  <rect x="495" y="375" width="290" height="54" class="box"/><text x="515" y="408" class="s">⌕  Support Navigator  →</text>
  <rect x="495" y="429" width="290" height="50" class="box"/><text x="515" y="460" class="s">▣  My appointments  →</text>
  <rect x="495" y="479" width="290" height="50" class="box"/><text x="515" y="510" class="s">▤  Learning materials</text>
  <rect x="495" y="529" width="290" height="51" class="box"/><text x="515" y="560" class="s">◷  My timetable</text>
