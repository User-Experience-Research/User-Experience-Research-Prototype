<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="720" viewBox="0 0 1000 720" role="img" aria-labelledby="title desc">
  <title id="title">Support Guide chat wireframe</title>
  <desc id="desc">Black and white line drawing of the bottom-right Support Guide dialog, conversation, suggestions and confirmation-gated actions.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#000"/></marker><style>.box{fill:#fff;stroke:#000;stroke-width:3}.thin{fill:none;stroke:#000;stroke-width:2}.dash{fill:#fff;stroke:#000;stroke-width:2;stroke-dasharray:8 6}.t{font-family:Arial,sans-serif;fill:#000;font-size:19px}.s{font-family:Arial,sans-serif;fill:#000;font-size:15px}.h{font-family:Arial,sans-serif;fill:#000;font-size:28px;font-weight:700}.line{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="1000" height="720" fill="#fff"/>
  <text x="35" y="42" class="h">C1 — Immediate Support Guide</text>
  <rect x="45" y="80" width="575" height="560" class="box"/>
  <text x="70" y="115" class="s">Underlying portal page</text>
  <rect x="80" y="145" width="280" height="45" class="box"/><rect x="80" y="215" width="500" height="100" class="box"/>
  <rect x="80" y="340" width="500" height="100" class="box"/><rect x="80" y="465" width="500" height="100" class="box"/>
  <rect x="325" y="120" width="270" height="500" class="box"/>
  <text x="345" y="152" class="s">IMMEDIATE GUIDANCE</text>
  <text x="345" y="185" class="t">Support Guide</text><text x="560" y="185" class="t">×</text>
  <line x1="325" y1="203" x2="595" y2="203" class="thin"/>
  <text x="345" y="228" class="s">Routing help, not diagnosis.</text>
  <rect x="345" y="250" width="225" height="60" class="box"/>
  <text x="355" y="275" class="s">What is happening?</text><text x="355" y="297" class="s">You do not need a category.</text>
  <rect x="380" y="325" width="190" height="48" class="box"/>
  <text x="393" y="355" class="s">I am stressed about...</text>
  <rect x="345" y="390" width="225" height="90" class="box"/>
  <text x="355" y="415" class="s">Two options may fit:</text><text x="355" y="438" class="s">1. Academic Skills</text><text x="355" y="461" class="s">2. Student Wellbeing</text>
  <rect x="345" y="495" width="70" height="30" class="box"/><text x="354" y="516" class="s">Deadline</text>
  <rect x="423" y="495" width="68" height="30" class="box"/><text x="432" y="516" class="s">Digital</text>
  <rect x="345" y="542" width="160" height="55" class="box"/><text x="355" y="573" class="s">Your message...</text>
  <rect x="515" y="542" width="55" height="55" class="box"/><text x="526" y="575" class="s">Send</text>
  <rect x="660" y="95" width="305" height="130" class="dash"/>
  <text x="680" y="128" class="s">DeepSeek V4 Flash receives current taxonomy</text><text x="680" y="153" class="s">through server tools, not a copied static list.</text><text x="680" y="178" class="s">No key → database-guided fallback.</text>
  <path d="M660 185 C635 200 620 235 575 275" class="line"/>
  <rect x="660" y="270" width="305" height="155" class="dash"/>
  <text x="680" y="303" class="s">Assistant explains overlap before recommending:</text><text x="680" y="328" class="s">scope • provider • eligibility • response</text><text x="680" y="353" class="s">access • location • preparation • privacy</text><text x="680" y="390" class="s">It does not diagnose.</text>
  <path d="M660 360 C630 375 610 415 570 435" class="line"/>
  <rect x="660" y="480" width="305" height="130" class="dash"/>
  <text x="680" y="513" class="s">Book and cancel tools are user-scoped.</text><text x="680" y="538" class="s">The assistant must ask for an explicit</text><text x="680" y="563" class="s">confirmation before changing data.</text>
  <path d="M660 550 C625 560 600 570 570 570" class="line"/>
  <text x="45" y="685" class="s">Teacher feedback: students may need immediate help before they can name a category or speak to a person.</text>
</svg>
