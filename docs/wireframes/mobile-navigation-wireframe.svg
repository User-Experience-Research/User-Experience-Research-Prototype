<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Mobile portal navigation wireframe</title>
  <desc id="desc">Black and white line drawing showing the mobile portal with the navigation drawer closed and open.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#000"/></marker>
    <style>.box{fill:#fff;stroke:#000;stroke-width:3}.thin{fill:none;stroke:#000;stroke-width:2}.dash{fill:#fff;stroke:#000;stroke-width:2;stroke-dasharray:8 6}.t{font-family:Arial,sans-serif;fill:#000;font-size:19px}.s{font-family:Arial,sans-serif;fill:#000;font-size:15px}.h{font-family:Arial,sans-serif;fill:#000;font-size:28px;font-weight:700}.line{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="760" fill="#fff"/>
  <text x="35" y="42" class="h">M1 — Shared mobile navigation states</text>

  <text x="55" y="88" class="t">Closed state</text>
  <rect x="55" y="105" width="350" height="585" rx="18" class="box"/>
  <rect x="55" y="105" width="350" height="60" class="box"/>
  <rect x="70" y="118" width="42" height="34" class="box"/><text x="83" y="142" class="t">☰</text>
  <text x="160" y="142" class="s">Current page title</text>
  <rect x="315" y="116" width="75" height="38" class="box"/><text x="325" y="141" class="s">A+ text</text>
  <rect x="55" y="165" width="350" height="120" class="box"/>
  <circle cx="230" cy="225" r="46" class="box"/><text x="197" y="232" class="s">N M S I</text>
  <text x="80" y="330" class="s">PAGE EYEBROW</text><text x="80" y="367" class="h">Page heading</text>
  <rect x="80" y="395" width="300" height="90" class="box"/>
  <rect x="80" y="505" width="300" height="90" class="box"/>
  <circle cx="360" cy="645" r="24" class="box"/><text x="353" y="651" class="s">✦</text>

  <text x="475" y="88" class="t">Open drawer state</text>
  <rect x="475" y="105" width="350" height="585" rx="18" class="box"/>
  <rect x="475" y="105" width="350" height="585" class="dash"/>
  <rect x="475" y="105" width="285" height="585" class="box"/>
  <rect x="475" y="105" width="285" height="70" class="box"/>
  <circle cx="520" cy="140" r="25" class="box"/><text x="502" y="146" class="s">NMSI</text>
  <text x="555" y="147" class="t">NMSI</text>
  <rect x="705" y="105" width="55" height="70" class="box"/><text x="722" y="147" class="t">←</text>
  <text x="500" y="210" class="s">John doe</text>
  <rect x="475" y="235" width="285" height="54" class="box"/><text x="500" y="269" class="t">⌂  Home</text>
  <text x="500" y="325" class="t">⌕  Support Navigator</text>
  <text x="500" y="380" class="t">▣  My appointments</text>
  <text x="500" y="435" class="t">▤  Learning</text>
  <text x="500" y="490" class="t">◷  My timetable</text>
  <rect x="500" y="585" width="230" height="46" class="box"/><text x="520" y="615" class="t">↪  Sign out</text>
  <text x="500" y="661" class="s">Privacy · Terms · Accessibility</text>

  <rect x="880" y="125" width="270" height="125" class="dash"/>
  <text x="900" y="157" class="s">Menu remains aligned on every route.</text>
  <text x="900" y="182" class="s">The current route changes only the</text>
  <text x="900" y="207" class="s">title and selected navigation row.</text>
  <path d="M880 205 C845 220 805 245 760 260" class="line"/>
  <rect x="880" y="305" width="270" height="155" class="dash"/>
  <text x="900" y="337" class="s">Closed: drawer is inert and hidden</text>
  <text x="900" y="362" class="s">from the accessibility tree.</text>
  <text x="900" y="397" class="s">Open: focus moves to Close; Tab is</text>
  <text x="900" y="422" class="s">contained; Escape and backdrop close.</text>
  <path d="M880 385 C835 370 800 330 760 295" class="line"/>
  <rect x="880" y="520" width="270" height="105" class="dash"/>
  <text x="900" y="552" class="s">Persistent large-font control and</text>
  <text x="900" y="577" class="s">Support Guide remain available.</text>
  <path d="M880 575 C845 605 820 625 800 645" class="line"/>

  <text x="55" y="730" class="s">Shared shell change: Dashboard, Support Search, Facility Detail and My Appointments use the same mobile drawer.</text>
</svg>
