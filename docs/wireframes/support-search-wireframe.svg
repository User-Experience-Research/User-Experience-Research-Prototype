  <text x="235" y="165" class="h">Student Support Navigator</text>
  <text x="235" y="193" class="s">Search in your own words, then compare plausible sources.</text>
  <rect x="235" y="215" width="555" height="96" class="box"/>
  <text x="252" y="241" class="s">What would you like help with?</text>
  <rect x="252" y="252" width="285" height="40" class="box"/><text x="263" y="277" class="s">deadline stress...</text>
  <rect x="548" y="252" width="145" height="40" class="box"/><text x="558" y="277" class="s">Need area ▾</text>
  <rect x="704" y="252" width="70" height="40" class="box"/><text x="716" y="277" class="s">Search</text>
  <text x="235" y="342" class="t">3 support sources</text>
  <rect x="235" y="360" width="555" height="82" class="box"/>
  <rect x="252" y="372" width="90" height="22" class="box"/><text x="260" y="388" class="s">Academic</text>
  <text x="252" y="420" class="t">Academic Skills &amp; Extensions</text>
  <text x="552" y="385" class="s">Provider • 8 min</text><text x="552" y="410" class="s">Same day • 4.7/5</text>
  <rect x="235" y="452" width="555" height="82" class="box"/>
  <rect x="252" y="464" width="88" height="22" class="box"/><text x="260" y="480" class="s">Wellbeing</text>
  <text x="252" y="512" class="t">Student Wellbeing</text>
  <text x="552" y="477" class="s">Counsellor • Online</text><text x="552" y="502" class="s">2 days • 4.6/5</text>
  <rect x="235" y="544" width="555" height="82" class="box"/>
  <text x="252" y="576" class="t">Programme Advice Hub</text>
  <text x="552" y="569" class="s">Adviser • 5 min</text><text x="552" y="594" class="s">Next day • 4.4/5</text>
  <circle cx="785" cy="630" r="25" class="box"/><text x="777" y="637" class="t">?</text>
  <rect x="855" y="105" width="215" height="120" class="dash"/>
  <text x="873" y="137" class="s">Search spans category</text><text x="873" y="161" class="s">keywords and facility scope,</text><text x="873" y="185" class="s">not only official names.</text>
  <path d="M855 180 C825 205 795 240 690 260" class="line"/>
