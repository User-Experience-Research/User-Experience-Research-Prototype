<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Support search wireframe</title>
  <desc id="desc">Black and white line drawing of search, category filter, comparison cards and Support Guide launcher.</desc>
  <defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 Z" fill="#000"/></marker><style>.box{fill:#fff;stroke:#000;stroke-width:3}.thin{fill:none;stroke:#000;stroke-width:2}.dash{fill:#fff;stroke:#000;stroke-width:2;stroke-dasharray:8 6}.t{font-family:Arial,sans-serif;fill:#000;font-size:19px}.s{font-family:Arial,sans-serif;fill:#000;font-size:15px}.h{font-family:Arial,sans-serif;fill:#000;font-size:28px;font-weight:700}.line{fill:none;stroke:#000;stroke-width:2;marker-end:url(#arrow)}</style></defs>
  <rect width="1100" height="720" fill="#fff"/>
  <text x="35" y="42" class="h">S1 — Find and compare support sources</text>
  <rect x="35" y="75" width="790" height="590" class="box"/>
  <rect x="35" y="75" width="170" height="590" class="box"/>
  <text x="65" y="115" class="h">NMSI</text><text x="58" y="170" class="s">Home</text>
